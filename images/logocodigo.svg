<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 50 400 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Texto c0dig0 con ceros en verde brillante -->
  <text x="400" y="130" font-family="monospace" font-size="90" font-weight="bold" 
        text-anchor="middle" letter-spacing="4" filter="url(#glow)">
    <tspan fill="#000000">c</tspan><tspan fill="#00E000">0</tspan><tspan fill="#000000">dig</tspan><tspan fill="#00E000">0</tspan>
  </text>
</svg>